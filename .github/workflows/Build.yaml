name: Build
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: "Windows Visual Studio"
            build-dir: Build/VS
          - os: ubuntu-latest
            preset: "Linux Clang"
            build-dir: Build/Clang
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: "x64"
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build clang
          autoconf automake libtool m4 pkg-config gettext
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.2.0"
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}
          max-size: 500M
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-
      - name: Configure
        run: >
          cmake --preset "${{ matrix.preset }}" -DBUILD_TESTS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build ${{ matrix.build-dir }} --config Release
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build ${{ matrix.build-dir }}
      - name: ccache stats
        run: ccache -s
      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cd ${{ matrix.build-dir }}
          ctest -C Release --output-on-failure
      - name: Run Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          cd ${{ matrix.build-dir }}
          ctest --output-on-failure
