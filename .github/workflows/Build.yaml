name: Build
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: "Windows Visual Studio"
            build-dir: Build/VS
          - os: ubuntu-latest
            preset: "Linux Clang"
            build-dir: Build/Clang
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros
      # Instructs vcpkg to directly stream and fetch compiled packages to/from GitHub's Cache API
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: "x64"
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build
          autoconf autoconf-archive automake libtool m4 pkg-config gettext
          '^libxcb.*-dev' libx11-xcb-dev libglu1-mesa-dev libxrender-dev
          libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1-mesa-dev
      - name: Install Clang 19
        if: runner.os == 'Linux'
        run: >
          wget https://apt.llvm.org/llvm.sh && chmod +x llvm.sh &&
          sudo ./llvm.sh 19
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.2.0"
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}
          max-size: 500M
      - name: Configure
        run: >
          cmake --preset "${{ matrix.preset }}" -DBUILD_TESTS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build ${{ matrix.build-dir }} --config Debug
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build ${{ matrix.build-dir }}
      - name: ccache stats
        run: ccache -s
      - name: Diagnose test discovery (Windows)
        if: runner.os == 'Windows'
        run: |
          Write-Output "--- Tests/*.cmake ---"
          Get-ChildItem Build/VS/Tests/*.cmake | Select-Object Name
          Write-Output "--- Tests/Bin/Debug ---"
          Get-ChildItem Build/VS/Tests/Bin/Debug
          Write-Output "--- Running Tests.exe --gtest_list_tests directly ---"
          & Build/VS/Tests/Bin/Debug/Tests.exe --gtest_list_tests
          Write-Output "EXITCODE: $LASTEXITCODE"
      - name: Diagnose test discovery (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "--- Tests/*.cmake ---"
          ls -la Build/Clang/Tests/*.cmake || true
          echo "--- Tests/Bin ---"
          ls -la Build/Clang/Tests/Bin || true
          echo "--- Running Tests directly ---"
          Build/Clang/Tests/Bin/Tests --gtest_list_tests || echo "EXITCODE:$?"
      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cd ${{ matrix.build-dir }}
          ctest -C Debug --output-on-failure
      - name: Run Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          cd ${{ matrix.build-dir }}
          ctest --output-on-failure
