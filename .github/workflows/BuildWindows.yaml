name: Build Windows
on:
  workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: 'x64'
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30'
      - name: Configure
        run: cmake --preset "Windows Visual Studio" -DBUILD_TESTS=ON
      - name: Build
        run: |
          msbuild Build/VS/ALL_BUILD.vcxproj -p:Configuration=Release -p:Platform=x64
      - name: Run Tests
        run: |
          cd Build/VS
          ctest -C Release --output-on-failure
          